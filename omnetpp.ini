[General]
network = LteNetwork
sim-time-limit = 4s
warmup-period = 0.5s
seed-set = 1
num-rngs = 4
cmdenv-express-mode = true
cmdenv-status-frequency = 2s
result-dir = results

# Stage 1: 2 identical users sharing B = 30 PRBs with cycle = 1 ms at 50% load.
[Config LteTwoUsers]
description = "LTE 2 identical users (initial stage)"
*.algorithm = "rr"
*.offeredLoad = 0.5
*.numUsers = 2
*.numPrbs = 30
*.cycle = 1ms
*.user[*].weight = 1
# ia = K / (load * B / TB) = 2 / (0.5 * 30000) = 0.133333ms
*.user[*].interarrivalTime = exponential(0.133333ms)

# Stage 2 base configuration: K = 10 users with differentiated weights W[i], B = 30 PRBs, TB = 1 ms.
[Config LteBase]
description = "LTE 10 users base configuration"
*.algorithm = "wrr"
*.offeredLoad = 0.5
*.numUsers = 10
*.numPrbs = 30
*.cycle = 1ms
*.maxPrbsPerUser = 10
*.user[0].weight = 8
*.user[1].weight = 6
*.user[2..6].weight = 2
*.user[7..9].weight = 1
*.user[*].interarrivalTime = exponential(0.666667ms)

# ---------------------------------------------------------------------------
# Mean delay vs network load (30%, 50%, 70%, 90%) with differentiated weights:
#   2 HP users: W[0] = 8, W[1] = 6
#   5 MP users: W[2..6] = 2
#   3 LP users: W[7..9] = 1
# Capacity = B / TB = 30 / 1ms = 30,000 packets/s.
# Interarrival time per user: ia = K / (load * 30000):
#   30% -> 1.111111ms,  50% -> 0.666667ms,
#   70% -> 0.476190ms,  90% -> 0.370370ms
# 6 algorithms x 4 loads = 24 runs (-r 0..23)
# ---------------------------------------------------------------------------
[Config LteLoadSweep]
extends = LteBase
description = "LTE ${alg} load ${load}"
*.algorithm = ${alg="fixed","rr","wrr","lq","os","pf"}
*.offeredLoad = ${load=0.3,0.5,0.7,0.9}
*.user[*].interarrivalTime = exponential(${ia=1.111111ms,0.666667ms,0.476190ms,0.370370ms ! load})
